[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-source-finder"
version = "0.2.0"
description = "Find original passages from Chinese translations, locally."
requires-python = ">=3.10"
dependencies = ["pypdf>=6,<7"]

[project.scripts]
book-source-finder = "source_finder.__main__:main"

[tool.setuptools.package-data]
source_finder = ["static/*"]

[tool.setuptools.packages.find]
include = ["source_finder*"]
